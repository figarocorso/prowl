name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# goreleaser-action@v6 still ships a Node 20 entrypoint. Force the runner to
# execute JS actions on Node 24 so the deprecated-Node-20 warning goes away
# (Node 20 is removed from runners on 2026-09-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # syft is invoked by goreleaser's `sboms:` block to produce per-archive
      # SPDX JSON SBOMs.
      - name: install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
